<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PocketSmart AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #f5f6ef;
      color: #25291f;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 700px;
      margin: 25px auto;
    }

    h1 { margin-bottom: 8px; }
    h1 span { color: #698348; }

    .intro { color: #666; line-height: 1.5; }

    form, .card {
      background: white;
      border: 1px solid #e3e5dc;
      border-radius: 14px;
      padding: 20px;
      margin-top: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cfd3c6;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea { min-height: 75px; }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      color: white;
      background: #698348;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    }

    .card h3 { margin-bottom: 8px; }
    .muted { color: #666; line-height: 1.5; }
    .price { font-weight: bold; }
    .search { color: #58743b; font-weight: bold; }
    .notice { margin-top: 18px; color: #777; font-size: 13px; }
  </style>
</head>

<body>
  <main>
    <h1>Pocket<span>Smart</span> AI</h1>
    <p class="intro">
      Plan home decor, events, and jewelry shopping within your budget.
    </p>

    <form id="planner">
      <label for="category">What are you planning?</label>
      <select id="category">
        <option>Home decor</option>
        <option>Event planning</option>
        <option>Jewelry shopping</option>
      </select>

      <label for="budget">Your budget (₹)</label>
      <input id="budget" type="number" min="1" placeholder="Example: 25000" required>

      <label for="needs">What do you need?</label>
      <textarea id="needs" placeholder="Example: living room makeover, birthday party"></textarea>

      <button type="submit">Show my ideas</button>
    </form>

    <section id="results"></section>

    <p class="notice">
      Demo suggestions only. These are not live products, prices, or availability.
    </p>
  </main>

  <script>
  const planner = document.getElementById("planner");
  const results = document.getElementById("results");

  planner.addEventListener("submit", async function (event) {
    event.preventDefault();

    const category = document.getElementById("category").value;
    const budget = Number(document.getElementById("budget").value);
    const needs = document.getElementById("needs").value.trim();

    const endpointName = {
      "Home decor": "home",
      "Event planning": "party",
      "Jewelry shopping": "jewelry"
    }[category];

    results.textContent = "Loading suggestions...";

    try {
      const response = await fetch(
        "https://pocketsmart-ai-hemd.onrender.com/generate-" + endpointName,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ budget: budget, needs: needs })
        }
      );

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");

      results.replaceChildren();

      const heading = document.createElement("h2");
      heading.textContent = "Your planning ideas";
      results.appendChild(heading);

      if (data.recommendation) {
        const paragraph = document.createElement("p");
        paragraph.textContent = data.recommendation;
        results.appendChild(paragraph);
      }

      if (data.suggestions) {
        data.suggestions.forEach(function (idea) {
          const card = document.createElement("article");
          card.className = "card";

          const title = document.createElement("h3");
          title.textContent = idea.name;

          const estimate = document.createElement("p");
          estimate.textContent =
            "Estimated budget: ₹" +
            Number(idea.estimated_budget).toLocaleString("en-IN");

          card.append(title, estimate);
          results.appendChild(card);
        });
      }
    } catch (error) {
      results.textContent =
        "Could not get suggestions. Please wait a little and try again.";
    }
  });
  </script>
</body>
</html>
